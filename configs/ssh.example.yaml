# Real credentials must not be stored in this repository.
# Prefer SSH keys and a local ~/.ssh/config entry instead of passwords.
#
# Example ~/.ssh/config:
# Host imperial-hpc
#     HostName login.cx3.hpc.ic.ac.uk
#     User nny124
#     IdentityFile ~/.ssh/id_ed25519
#     ForwardAgent yes
#
# Generate a key if needed:
# ssh-keygen -t ed25519 -C "nny124@imperial-hpc"
# ssh-copy-id imperial-hpc
#
# If ssh-copy-id is unavailable, copy the public key manually:
# 1. cat ~/.ssh/id_ed25519.pub
# 2. SSH to the cluster and create ~/.ssh if needed.
# 3. Append the public key to ~/.ssh/authorized_keys
# 4. chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys
ssh:
  host_alias: imperial-hpc
  auth: ssh-config-and-keys-only
