[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-flyby-explorer"
version = "0.1.0"
description = "Installable local API and dashboard for Mars flyby triage and outcome screening."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "catboost",
  "numpy",
  "pandas",
  "scikit-learn",
]

[project.scripts]
mars-flyby-dashboard = "triage.server:main"
mars-flyby-api = "triage.server:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
triage = ["templates/*.html", "templates/*.json"]
